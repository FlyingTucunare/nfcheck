<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFCheck</title>
<link rel="icon" href="/static/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nucleo/tokens.css?v=1">
<link rel="stylesheet" href="/static/nucleo/base.css?v=1">
<link rel="stylesheet" href="/static/nucleo/shell.css?v=1">
</head>
<body>
<div class="pagina">
  <div class="painel"><div class="vazio">
    <h4 id="tit">Em construção</h4>
    <p>Este módulo ainda está sendo desenvolvido.</p>
    <a class="btn btn-2" href="/painel">Voltar aos clientes</a>
  </div></div>
</div>
<script src="/static/nucleo/app.js?v=1"></script>
<script src="/static/nucleo/shell.js?v=1"></script>
<script>
(async () => {
  await Shell.monta();
  const id = location.pathname.split('/').pop();
  const m = [...MODULOS, ...ESCRITORIO].find(x => x.id === id);
  if (m) { $('#tit').textContent = m.nome; document.title = 'NFCheck — ' + m.nome; }
})();
</script>
</body>
</html>
