<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFCheck — Certificado</title>
<link rel="icon" href="/static/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nucleo/tokens.css?v=20260810161517">
<link rel="stylesheet" href="/static/nucleo/base.css?v=20260810161517">
<link rel="stylesheet" href="/static/nucleo/shell.css?v=20260810161517">
<style>
  .duas{display:grid;grid-template-columns:1fr 1fr;gap:var(--e-5);align-items:flex-start}
  @media(max-width:960px){.duas{grid-template-columns:1fr}}
  .bloco{padding:var(--e-5)}
  .bloco h3{font-size:var(--t-lg);margin-bottom:var(--e-4)}
  .dados{display:grid;grid-template-columns:auto 1fr;gap:10px var(--e-4);
    font-size:var(--t-md);margin:0}
  .dados dt{color:var(--txt-3);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.06em;font-weight:var(--p-forte);padding-top:1px}
  .dados dd{margin:0;word-break:break-word}
  .zona{border:2px dashed var(--linha);border-radius:var(--r-lg);padding:var(--e-6);
    text-align:center;cursor:pointer;transition:border-color var(--mov),
    background var(--mov)}
  .zona:hover,.zona.sobre{border-color:var(--acao);background:var(--acao-fraco)}
  .zona svg{width:30px;height:30px;color:var(--txt-3);margin-bottom:var(--e-3)}
  .zona b{display:block;font-size:var(--t-base);margin-bottom:4px}
</style>
</head>
<body>
<div class="pagina">
  <div class="pag-cab">
    <div><h1>Certificado digital</h1>
      <p>Arquivo A1 usado para consultar a SEFAZ e emitir documentos.</p></div>
  </div>
  <div id="alerta-topo"></div>
  <div class="duas">
    <div class="painel bloco">
      <h3>Certificado ativo</h3>
      <div id="ativo"></div>
    </div>
    <div class="painel bloco" id="col-envio">
      <h3>Enviar novo certificado</h3>
      <div class="aviso aviso-erro" id="c-erro"></div>
      <form onsubmit="return false" autocomplete="off">
        <div class="zona" id="zona">
          <div id="zona-txt"></div>
          <input type="file" id="c-arq" accept=".pfx,.p12" style="display:none">
        </div>
        <div id="previa" style="margin-top:var(--e-4)"></div>
        <div class="aviso aviso-alerta" id="c-aviso"></div>
        <div class="grupo" style="margin-top:var(--e-4)">
          <label class="rotulo" for="c-senha">Senha do certificado</label>
          <input class="campo" type="password" id="c-senha" autocomplete="new-password"
                 placeholder="Digite após escolher o arquivo">
        </div>
        <button class="btn btn-1" id="c-enviar" style="width:100%">Enviar certificado</button>
      </form>
    </div>
  </div>
  <div class="painel bloco" style="margin-top:var(--e-5)">
    <h3>Histórico</h3>
    <div id="hist"></div>
  </div>
</div>
<script src="/static/nucleo/app.js?v=20260810161517"></script>
<script src="/static/nucleo/shell.js?v=20260810161517"></script>
<script src="/static/modulos/certificado.js?v=20260810161517"></script>
</body>
</html>
