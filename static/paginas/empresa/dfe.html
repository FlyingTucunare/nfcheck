<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFCheck — Documentos</title>
<link rel="icon" href="/static/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nucleo/tokens.css?v=20260811193000">
<link rel="stylesheet" href="/static/nucleo/base.css?v=20260811193000">
<link rel="stylesheet" href="/static/nucleo/shell.css?v=20260811193000">
<style>
  .filtros{display:flex;flex-wrap:wrap;gap:var(--e-3);align-items:flex-end;
    background:var(--sup-1);border:1px solid var(--linha);border-radius:var(--r-lg);
    padding:var(--e-4);margin-bottom:var(--e-4)}
  .filtros .g{display:flex;flex-direction:column;gap:4px}
  .filtros .campo{height:34px}
  .det dl{display:grid;grid-template-columns:minmax(110px,auto) 1fr;
    gap:9px var(--e-4);font-size:var(--t-md);margin:0}
  .modal-cx{max-width:820px}
  .det table.dados{font-size:var(--t-sm)}
  .det table.dados td{height:32px}
  .det dt{color:var(--txt-3);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.06em;font-weight:var(--p-forte);padding-top:1px}
  .det dd{margin:0;word-break:break-word}
</style>
</head>
<body>
<div class="pagina">
  <div class="pag-cab">
    <div><h1>Documentos</h1>
      <p>NF-e, CT-e e NFS-e recebidas.</p></div>
    <div class="colunas" style="gap:var(--e-2)">
      <button class="btn btn-2" id="btn-emitentes"></button>
      <a class="btn btn-2" href="/e/importacao" id="btn-imp"></a>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="filtros">
    <div class="g"><label class="rotulo" for="f-de">De</label>
      <input class="campo" type="date" id="f-de"></div>
    <div class="g"><label class="rotulo" for="f-ate">Até</label>
      <input class="campo" type="date" id="f-ate"></div>
    <div class="g"><label class="rotulo" for="f-tipo">Tipo</label>
      <select class="campo" id="f-tipo">
        <option value="">Todos</option><option value="nfe">NF-e</option>
        <option value="cte">CT-e</option><option value="evento">Eventos</option>
      </select></div>
    <div class="g" style="flex:1;min-width:220px">
      <label class="rotulo" for="f-busca">Buscar</label>
      <input class="campo" id="f-busca" placeholder="Emitente, CNPJ, número ou chave">
    </div>
    <button class="btn btn-2" id="f-limpar">Limpar</button>
  </div>

  <div class="barra-sel" id="barra-sel">
    <span><b id="sel-n">0</b> <span id="sel-plural">documentos</span> selecionados</span>
    <span class="empurra colunas" style="gap:var(--e-2)">
      <button class="btn btn-2 btn-sm" id="sel-xml">Baixar XML</button>
      <button class="btn btn-2 btn-sm" id="sel-pdf">Baixar DANFE</button>
      <button class="btn btn-2 btn-sm" id="sel-manif">Manifestar</button>
      <button class="btn btn-3 btn-sm" id="sel-limpar">Limpar</button>
    </span>
  </div>

  <div id="area"></div>
</div>
<script src="/static/nucleo/app.js?v=20260811193000"></script>
<script src="/static/nucleo/grid.js?v=20260811193000"></script>
<script src="/static/nucleo/shell.js?v=20260811193000"></script>
<script src="/static/modulos/dfe.js?v=20260811193000"></script>
</body>
</html>
