<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFCheck — Empresa</title>
<link rel="icon" href="/static/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nucleo/tokens.css?v=20260811183705">
<link rel="stylesheet" href="/static/nucleo/base.css?v=20260811183705">
<link rel="stylesheet" href="/static/nucleo/shell.css?v=20260811183705">
<style>
  .faixa{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:1px;background:var(--linha);border:1px solid var(--linha);
    border-radius:var(--r-lg);overflow:hidden;margin-bottom:var(--e-6)}
  .faixa .fi{background:var(--sup-1);padding:18px var(--e-5);text-align:left;
    border:0;cursor:default;transition:background var(--mov-rapido)}
  .faixa .fi.cli{cursor:pointer}
  .faixa .fi.cli:hover{background:var(--sup-hover)}
  .faixa .fv{font-family:var(--fonte-num);font-size:24px;font-weight:var(--p-medio);
    letter-spacing:-.03em;line-height:1.1}
  .faixa .fr{font-size:10.5px;color:var(--txt-2);text-transform:uppercase;
    letter-spacing:.08em;margin-top:6px;font-weight:var(--p-forte)}
  .faixa .fi.al .fv{color:var(--aviso)}
  .faixa .fi.er .fv{color:var(--erro)}
  .secao{margin-bottom:var(--e-6)}
  .secao h3{font-size:var(--t-lg);margin-bottom:var(--e-4)}
  .duas{display:grid;grid-template-columns:1.55fr 1fr;gap:var(--e-5);
    align-items:flex-start}
  @media(max-width:1000px){.duas{grid-template-columns:1fr}}
  .ficha{display:grid;grid-template-columns:auto 1fr;gap:10px var(--e-4);
    font-size:var(--t-md);margin:0}
  .ficha dt{color:var(--txt-3);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.06em;font-weight:var(--p-forte);padding-top:1px}
  .ficha dd{margin:0}
  .al-lista{display:flex;flex-direction:column;gap:var(--e-2);margin-bottom:var(--e-5)}
  .al-item{display:flex;align-items:flex-start;gap:var(--e-3);padding:12px var(--e-4);
    border-radius:var(--r);font-size:var(--t-md);border:1px solid transparent}
  .al-item svg{flex-shrink:0;margin-top:1px}
  .al-aviso{background:var(--aviso-fundo);color:var(--aviso);border-color:var(--aviso-borda)}
  .al-erro{background:var(--erro-fundo);color:var(--erro);border-color:var(--erro-borda)}
</style>
</head>
<body>
<div class="pagina">
  <div id="alertas" class="al-lista"></div>
  <div id="faixa"></div>

  <div class="secao">
    <h3>Módulos</h3>
    <div id="modulos"></div>
  </div>

  <div class="duas">
    <div class="secao">
      <h3>Documentos recentes</h3>
      <div id="docs"></div>
    </div>
    <div class="secao">
      <h3>Ficha</h3>
      <div class="painel" style="padding:var(--e-5)"><dl class="ficha" id="ficha"></dl></div>
    </div>
  </div>
</div>

<script src="/static/nucleo/app.js?v=20260811183705"></script>
<script src="/static/nucleo/grid.js?v=20260811183705"></script>
<script src="/static/nucleo/shell.js?v=20260811183705"></script>
<script src="/static/modulos/empresa-home.js?v=20260811183705"></script>
</body>
</html>
