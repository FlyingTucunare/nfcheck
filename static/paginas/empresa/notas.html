<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFCheck — Notas emitidas</title>
<link rel="icon" href="/static/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nucleo/tokens.css?v=20260814022400">
<link rel="stylesheet" href="/static/nucleo/base.css?v=20260814022400">
<link rel="stylesheet" href="/static/nucleo/shell.css?v=20260814022400">
<style>
  .filtros{display:flex;gap:var(--e-4);align-items:flex-end;flex-wrap:wrap;
    background:var(--sup-1);border:1px solid var(--linha);border-radius:var(--r-lg);
    padding:var(--e-4) var(--e-5);margin-bottom:var(--e-4)}
  .filtros .campo-grupo{margin:0}
  .filtros .rotulo{font-size:var(--t-xs)}
  .filtros input,.filtros select{min-width:150px}
  .det .rl{display:flex;justify-content:space-between;gap:var(--e-4);padding:6px 0;
    border-bottom:1px dotted var(--linha);font-size:var(--t-sm)}
  .det .rl:last-child{border-bottom:none}
  .det .rl span{color:var(--txt-3)}
  .det .rl b{font-family:var(--fonte-num);text-align:right}
  .det h4{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;
    color:var(--txt-3);margin:var(--e-5) 0 var(--e-2)}
</style>
</head>
<body>
<div class="pagina">
  <div class="pag-cab">
    <div><h1>Notas emitidas</h1>
      <p>NFS-e emitidas por esta empresa.</p></div>
    <button class="btn btn-1" id="nova"></button>
  </div>

  <div class="aviso aviso-erro" id="erro"></div>
  <div class="kpis" id="kpis"></div>

  <div class="filtros">
    <div class="campo-grupo">
      <label class="rotulo">Competência de</label>
      <div style="display:flex;gap:var(--e-2)">
        <select class="campo" id="mes-de"></select>
        <select class="campo" id="ano-de" style="min-width:100px"></select>
      </div>
    </div>
    <div class="campo-grupo">
      <label class="rotulo">até</label>
      <div style="display:flex;gap:var(--e-2)">
        <select class="campo" id="mes-ate"></select>
        <select class="campo" id="ano-ate" style="min-width:100px"></select>
      </div>
    </div>
    <button class="btn btn-2" id="b-limpar">Limpar</button>
  </div>

  <div id="barra"></div>
  <div id="area"></div>
</div>

<script src="/static/nucleo/app.js?v=20260814022400"></script>
<script src="/static/nucleo/grid.js?v=20260814022400"></script>
<script src="/static/nucleo/shell.js?v=20260827090000"></script>
<script src="/static/modulos/notas.js?v=20260814022400"></script>
</body>
</html>
