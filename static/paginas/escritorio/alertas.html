<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFCheck — Alertas</title>
<link rel="icon" href="/static/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nucleo/tokens.css?v=20260814023503">
<link rel="stylesheet" href="/static/nucleo/base.css?v=20260814023503">
<link rel="stylesheet" href="/static/nucleo/shell.css?v=20260814023503">
<style>
  .lista{display:flex;flex-direction:column;gap:var(--e-3)}
  .item{background:var(--sup-1);border:1px solid var(--linha);
    border-left:3px solid var(--linha-forte);border-radius:var(--r-lg);
    padding:var(--e-4) var(--e-5);display:flex;gap:var(--e-4);align-items:flex-start}
  .item.erro{border-left-color:var(--erro)}
  .item.aviso{border-left-color:var(--aviso)}
  .item.feito{opacity:.6;border-left-color:var(--ok)}
  .item .txt{flex:1;min-width:0}
  .item h3{font-size:var(--t-md);margin:0 0 4px;line-height:1.35}
  .item p{margin:0;font-size:var(--t-sm);color:var(--txt-2);line-height:1.55}
  .item .meta{font-size:var(--t-xs);color:var(--txt-3);margin-top:8px;
    display:flex;gap:var(--e-4);flex-wrap:wrap}
  .item .acoes{display:flex;gap:var(--e-2);flex:none}
  .vazio-ok{text-align:center;padding:var(--e-7) var(--e-5);color:var(--txt-2)}
  .vazio-ok .ic{width:52px;height:52px;border-radius:50%;background:var(--ok-fundo);
    color:var(--ok);display:flex;align-items:center;justify-content:center;
    margin:0 auto var(--e-4)}
</style>
</head>
<body>
<div class="pagina">
  <div class="pag-cab">
    <div><h1>Alertas</h1>
      <p>O que precisa de atenção nas empresas.</p></div>
    <button class="btn btn-2" id="verificar"></button>
  </div>
  <div class="aviso aviso-erro" id="erro"></div>
  <div class="kpis" id="kpis"></div>
  <div id="lista"></div>
</div>
<script src="/static/nucleo/app.js?v=20260814023503"></script>
<script src="/static/nucleo/shell.js?v=20260827090000"></script>
<script src="/static/modulos/alertas.js?v=20260814023503"></script>
</body>
</html>
