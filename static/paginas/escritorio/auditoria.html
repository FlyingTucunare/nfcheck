<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFCheck — Auditoria</title>
<link rel="icon" href="/static/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nucleo/tokens.css?v=20260814023503">
<link rel="stylesheet" href="/static/nucleo/base.css?v=20260814023503">
<link rel="stylesheet" href="/static/nucleo/shell.css?v=20260814023503">
<style>
  .filtros{display:flex;gap:var(--e-4);align-items:flex-end;flex-wrap:wrap;
    background:var(--sup-1);border:1px solid var(--linha);border-radius:var(--r-lg);
    padding:var(--e-4) var(--e-5);margin-bottom:var(--e-4)}
  .filtros .campo-grupo{margin:0}
  .filtros .rotulo{font-size:var(--t-xs)}
  .filtros input,.filtros select{min-width:150px}
  .det{font-family:var(--fonte-num);font-size:var(--t-xs);white-space:pre-wrap;
    background:var(--sup-2);border-radius:var(--r);padding:var(--e-4);
    line-height:1.6;max-height:320px;overflow:auto}
</style>
</head>
<body>
<div class="pagina">
  <div class="pag-cab">
    <div><h1>Auditoria</h1>
      <p>Quem fez o quê, quando e de onde.</p></div>
  </div>
  <div class="aviso aviso-erro" id="erro"></div>
  <div class="filtros">
    <div class="campo-grupo"><label class="rotulo">De</label>
      <input class="campo" id="f-inicio" type="date"></div>
    <div class="campo-grupo"><label class="rotulo">Até</label>
      <input class="campo" id="f-fim" type="date"></div>
    <div class="campo-grupo"><label class="rotulo">Ação</label>
      <select class="campo" id="f-acao"></select></div>
    <button class="btn btn-2" id="b-limpar">Limpar</button>
  </div>
  <div id="barra"></div>
  <div id="area"></div>
</div>
<script src="/static/nucleo/app.js?v=20260814023503"></script>
<script src="/static/nucleo/grid.js?v=20260814023503"></script>
<script src="/static/nucleo/shell.js?v=20260827090000"></script>
<script src="/static/modulos/auditoria.js?v=20260814023503"></script>
</body>
</html>
