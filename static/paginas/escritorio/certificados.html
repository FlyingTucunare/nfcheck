<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFCheck — Certificados</title>
<link rel="icon" href="/static/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nucleo/tokens.css?v=20260814023503">
<link rel="stylesheet" href="/static/nucleo/base.css?v=20260814023503">
<link rel="stylesheet" href="/static/nucleo/shell.css?v=20260814023503">
<style>
  .campo-grupo{margin-bottom:var(--e-4)}
  .dica{font-size:var(--t-xs);color:var(--txt-3);margin-top:5px;line-height:1.45}
  .solta{border:1.5px dashed var(--linha-forte);border-radius:var(--r-lg);
    padding:var(--e-6) var(--e-5);text-align:center;cursor:pointer;
    transition:border-color var(--mov),background var(--mov)}
  .solta:hover{border-color:var(--acao);background:var(--acao-fraco)}
  .solta b{display:block;margin-top:var(--e-2)}
  .solta .t3{display:block;margin-top:4px}
  .hist{border:1px solid var(--linha);border-radius:var(--r);overflow:hidden}
  .hist div{display:flex;justify-content:space-between;gap:var(--e-4);
    padding:9px var(--e-4);font-size:var(--t-sm);border-bottom:1px solid var(--linha)}
  .hist div:last-child{border-bottom:none}
</style>
</head>
<body>
<div class="pagina">
  <div class="pag-cab">
    <div><h1>Certificados</h1>
      <p>Validade dos certificados A1 de todas as empresas.</p></div>
  </div>
  <div class="aviso aviso-erro" id="erro"></div>
  <div class="kpis" id="kpis"></div>
  <div id="barra"></div>
  <div id="area"></div>
</div>
<script src="/static/nucleo/app.js?v=20260814023503"></script>
<script src="/static/nucleo/grid.js?v=20260814023503"></script>
<script src="/static/nucleo/shell.js?v=20260827090000"></script>
<script src="/static/modulos/certificados.js?v=20260814023503"></script>
</body>
</html>
