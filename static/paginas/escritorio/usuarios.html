<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFCheck — Usuários e acessos</title>
<link rel="icon" href="/static/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/nucleo/tokens.css?v=20260814023503">
<link rel="stylesheet" href="/static/nucleo/base.css?v=20260814023503">
<link rel="stylesheet" href="/static/nucleo/shell.css?v=20260814023503">
<style>
  .grade2{display:grid;grid-template-columns:1fr 1fr;gap:var(--e-4)}
  .campo-grupo{margin-bottom:var(--e-4)}
  .dica{font-size:var(--t-xs);color:var(--txt-3);margin-top:5px;line-height:1.45}
  .lista-emp{max-height:210px;overflow:auto;border:1px solid var(--linha);
    border-radius:var(--r);padding:var(--e-3)}
  .lista-emp label{display:flex;gap:var(--e-3);align-items:flex-start;
    padding:7px 4px;cursor:pointer;font-size:var(--t-sm);line-height:1.4}
  .lista-emp label:hover{background:var(--sup-hover);border-radius:4px}
  .lista-emp .cnpj{font-family:var(--fonte-num);font-size:var(--t-xs);
    color:var(--txt-3);display:block}
  .senha-nova{background:var(--sup-2);border:1px solid var(--linha);
    border-radius:var(--r);padding:var(--e-4);text-align:center;margin:var(--e-4) 0}
  .senha-nova .v{font-family:var(--fonte-num);font-size:20px;
    font-weight:var(--p-forte);letter-spacing:.02em;margin-top:4px}
</style>
</head>
<body>
<div class="pagina">
  <div class="pag-cab">
    <div><h1>Usuários e acessos</h1>
      <p id="sub">Quem pode entrar no sistema e o que cada um enxerga.</p></div>
    <button class="btn btn-1" id="novo"></button>
  </div>

  <div class="aviso aviso-erro" id="erro"></div>
  <div class="kpis" id="kpis"></div>
  <div id="barra"></div>
  <div id="area"></div>
</div>

<script src="/static/nucleo/app.js?v=20260814023503"></script>
<script src="/static/nucleo/grid.js?v=20260814023503"></script>
<script src="/static/nucleo/shell.js?v=20260827090000"></script>
<script src="/static/modulos/usuarios.js?v=20260814023503"></script>
</body>
</html>
